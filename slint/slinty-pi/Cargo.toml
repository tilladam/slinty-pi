[package]
name = "slinty-pi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Native desktop app for the pi coding agent, built with Slint"

# `cargo bundle` (https://github.com/burtonageo/cargo-bundle) reads this to
# produce a macOS .app / Linux .deb / Windows .msi. `identifier` matches the
# qualifier/organization/application triple already used for the on-disk
# config dir in density.rs (directories::ProjectDirs::from("dev",
# "slinty-pi", "slinty-pi")), so both agree on what the app "is" to the OS.
[package.metadata.bundle]
identifier = "dev.slinty-pi.slinty-pi"
# cargo-bundle special-cases pre-built .icns/.ico files: it copies each in
# directly for macOS/Windows rather than re-deriving one from a PNG set, and
# for Linux it unpacks every size out of the .icns into the FreeDesktop
# hicolor theme. No need to also list a PNG here.
icon = ["assets/icon/icon.icns", "assets/icon/icon.ico"]
category = "Developer Tool"

[dependencies]
pi-core = { path = "../../crates/pi-core" }
# Slint from crates.io (1.18+ has the `mcp` feature — embedded MCP server).
#
# `mcp` is deliberately NOT enabled here (per the official Slint AI-plugins
# skill's guidance) — it pulls in a whole extra dependency tree (async-net,
# httparse, prost, protox, ...) that every normal build would otherwise pay
# for. Enable it per-invocation instead: see README.md's "Slint dependency
# and MCP" section.
# renderer-winit-skia: the winit backend prefers Skia (Metal on macOS) over
# the default femtovg renderer whenever it's compiled in. femtovg draws via
# glutin/OpenGL — a deprecated compatibility layer on macOS — and re-tessellates
# every path on the CPU each frame, which measurably loses to Skia's Metal
# pipeline on transcript-heavy frames.
# unstable-winit-030: the public winit event filter `install_file_drop` in
# main.rs uses to see OS file drops. Tied to winit 0.30; Slint may change it
# when it moves to a new winit major.
slint = { version = "1.18.1", features = ["renderer-winit-skia", "unstable-winit-030"] }
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
arboard = "3.6.1"
# Pasted images as their clipboard bytes (PNG/JPEG/TIFF) instead of arboard's
# decoded RGBA. `decoding-fallback` keeps image paste working off macOS,
# where only arboard's (decoding) reader exists. Same slint-kit rev as
# pi-render's md-segments; bump them together.
desktop-clipboard = { git = "https://github.com/tilladam/slint-kit", rev = "551aa54e88f77632fa3834243849c5264e639a85", features = ["decoding-fallback"] }
rfd = "0.17.2"
# Same crate Slint's winit backend uses for `Platform::open_url`.
webbrowser = "1.2"

[build-dependencies]
# Must match the `slint` runtime's version exactly — otherwise the compiled
# .slint code and the runtime types it references can drift apart, which
# fails loudly at compile time (missing/renamed fields).
slint-build = "=1.18.1"
# Embeds icon.ico into the .exe itself (taskbar/Explorer icon) — separate from
# cargo-bundle's .msi installer icon above. Deliberately NOT a
# `[target.'cfg(windows)'.build-dependencies]` entry: Cargo evaluates that
# cfg against the *host* building the crate, not the compile target, so it
# would both fail to build here (host is macOS) and silently skip embedding
# when cross-compiling for Windows from a non-Windows CI runner. Plain
# `embed_resource::compile()` checks the actual target itself and no-ops on
# non-Windows targets, so this is safe (and cheap) to keep unconditional.
embed-resource = "3.0"

