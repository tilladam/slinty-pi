[workspace]
resolver = "2"
members = ["crates/pi-rpc", "crates/pi-sessions", "crates/pi-render", "crates/pi-local", "crates/pi-core", "crates/pi-core-ffi", "slint/slinty-pi"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/tilladam/slinty-pi"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "sync", "time", "macros", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"

# Optimise all dependencies (not workspace members) in dev builds, mainly
# for image decoding (attachments); syntect and Slint's renderer likely gain
# too, unmeasured here. Yapper measured a 1280 px JPEG decode at ~170 ms debug vs
# ~7.5 ms optimised (2026-09-27). Costs a slower first build and makes
# stepping into dependency code in a debugger less precise.
[profile.dev.package."*"]
opt-level = 3
