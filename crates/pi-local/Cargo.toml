[package]
name = "pi-local"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Local-model backend foundation: rapid-mlx CLI integration, a llama.cpp router HTTP client, Hugging Face GGUF search, Ollama detection, ~/.pi/agent/{auth,models}.json handling, and system RAM-fit estimation. Toolkit- and frontend-agnostic. Shared by pi-core (Slint) and pi-core-ffi (Swift)."

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror.workspace = true
tokio.workspace = true
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream", "query"] }
# Only the memory-stats API `system_fit.rs` uses — the default feature set
# (specifically its macOS `users` enumeration code) references Apple's
# OpenDirectory framework, which a Rust staticlib doesn't declare a link
# requirement for the way a `cargo build` binary does; Xcode's own linker
# then can't resolve those symbols when linking PiCoreFFI.xcframework. Not
# needed anyway — `SystemMemory` only reads memory, never users.
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

[dev-dependencies]
tempfile = "3.27.0"
