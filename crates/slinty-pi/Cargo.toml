[package]
name = "slinty-pi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Native desktop app for the pi coding agent, built with Slint"

[dependencies]
pi-rpc = { path = "../pi-rpc" }
# Path dependency on the local Slint checkout (master), not crates.io. Needed
# for two things not yet in a published release (1.17.1 predates both):
#   - the `mcp` feature (embedded MCP server, see mcp-server.md in that repo)
#   - PR #11520, which makes `slint::platform::set_platform()` start that
#     server automatically for custom-platform apps like this one (without
#     it, only selector-based apps got the server for free)
# This ties slinty-pi's build to whatever's checked out on disk at
# /Users/till/Code/Rust/slint/slint — expected to move to crates.io pins
# once these land in a release.
#
# `mcp` is deliberately NOT enabled here (per the official Slint AI-plugins
# skill's guidance) — it pulls in a whole extra dependency tree (async-net,
# httparse, prost, protox, ...) that every normal build would otherwise pay
# for. Enable it per-invocation instead: see README.md's MCP section.
slint = { path = "/Users/till/Code/Rust/slint/slint/api/rs/slint" }
tokio.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
pulldown-cmark = "0.13.4"
arboard = "3.6.1"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
trash = "5.2.6"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
pi-sessions = { version = "0.1.0", path = "../pi-sessions" }
directories = "6.0.0"
nucleo-matcher = "0.3.1"
base64 = "0.23.0"
rfd = "0.17.2"
# Internal Slint crate (not semver-stable, must match `slint`'s source exactly
# — see the path dependency above); used to install a CustomApplicationHandler
# so we can see winit's WindowEvent::DroppedFile before Slint silently
# discards it. See crates/slinty-pi/src/main.rs's platform setup and
# attach.rs's doc comment.
i-slint-backend-winit = { path = "/Users/till/Code/Rust/slint/slint/internal/backends/winit" }
winit = "0.30"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream", "query"] }
sysinfo = "0.39.6"
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true

[build-dependencies]
# Must match the `slint` runtime's source exactly (same reasoning as above) —
# otherwise the compiled .slint code and the runtime types it references can
# drift apart, which fails loudly at compile time (missing/renamed fields).
slint-build = { path = "/Users/till/Code/Rust/slint/slint/api/rs/build" }

[dev-dependencies]
tempfile = "3.27.0"
