[package]
name = "slinty-pi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Native desktop app for the pi coding agent, built with Slint"

# `cargo bundle` (https://github.com/burtonageo/cargo-bundle) reads this to
# produce a macOS .app / Linux .deb / Windows .msi. `identifier` matches the
# qualifier/organization/application triple already used for the on-disk
# config dir in density.rs (directories::ProjectDirs::from("dev",
# "slinty-pi", "slinty-pi")), so both agree on what the app "is" to the OS.
[package.metadata.bundle]
identifier = "dev.slinty-pi.slinty-pi"
# cargo-bundle special-cases pre-built .icns/.ico files: it copies each in
# directly for macOS/Windows rather than re-deriving one from a PNG set, and
# for Linux it unpacks every size out of the .icns into the FreeDesktop
# hicolor theme. No need to also list a PNG here.
icon = ["assets/icon/icon.icns", "assets/icon/icon.ico"]
category = "Developer Tool"

[dependencies]
pi-rpc = { path = "../pi-rpc" }
pi-core = { path = "../pi-core" }
# Path dependency on the local Slint checkout (master), not crates.io. Needed
# for two things not yet in a published release (1.17.1 predates both):
#   - the `mcp` feature (embedded MCP server, see mcp-server.md in that repo)
#   - PR #11520, which makes `slint::platform::set_platform()` start that
#     server automatically for custom-platform apps like this one (without
#     it, only selector-based apps got the server for free)
# This ties slinty-pi's build to whatever's checked out on disk at
# /Users/till/Code/Rust/slint/slint — expected to move to crates.io pins
# once these land in a release.
#
# `mcp` is deliberately NOT enabled here (per the official Slint AI-plugins
# skill's guidance) — it pulls in a whole extra dependency tree (async-net,
# httparse, prost, protox, ...) that every normal build would otherwise pay
# for. Enable it per-invocation instead: see README.md's MCP section.
# renderer-winit-skia: the winit backend prefers Skia (Metal on macOS) over
# the default femtovg renderer whenever it's compiled in. femtovg draws via
# glutin/OpenGL — a deprecated compatibility layer on macOS — and re-tessellates
# every path on the CPU each frame, which measurably loses to Skia's Metal
# pipeline on transcript-heavy frames.
slint = { git = "https://github.com/slint-ui/slint.git", features = ["renderer-winit-skia"] }
tokio.workspace = true
# preserve_order: models.json editing needs Map iteration/serialization to
# follow the file's original key order, not alphabetical — see local::pi_config.
serde_json = { workspace = true, features = ["preserve_order"] }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
arboard = "3.6.1"
trash = "5.2.6"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
pi-sessions = { version = "0.1.0", path = "../pi-sessions" }
rfd = "0.17.2"
# Internal Slint crate (not semver-stable, must match `slint`'s source exactly
# — see the path dependency above); used to install a CustomApplicationHandler
# so we can see winit's WindowEvent::DroppedFile before Slint silently
# discards it. See crates/slinty-pi/src/main.rs's platform setup and
# attach.rs's doc comment.
i-slint-backend-winit = { git = "https://github.com/slint-ui/slint.git" }
winit = "0.30"
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true

[build-dependencies]
# Must match the `slint` runtime's source exactly (same reasoning as above) —
# otherwise the compiled .slint code and the runtime types it references can
# drift apart, which fails loudly at compile time (missing/renamed fields).
slint-build = { git = "https://github.com/slint-ui/slint.git" }
# Embeds icon.ico into the .exe itself (taskbar/Explorer icon) — separate from
# cargo-bundle's .msi installer icon above. Deliberately NOT a
# `[target.'cfg(windows)'.build-dependencies]` entry: Cargo evaluates that
# cfg against the *host* building the crate, not the compile target, so it
# would both fail to build here (host is macOS) and silently skip embedding
# when cross-compiling for Windows from a non-Windows CI runner. Plain
# `embed_resource::compile()` checks the actual target itself and no-ops on
# non-Windows targets, so this is safe (and cheap) to keep unconditional.
embed-resource = "3.0"

