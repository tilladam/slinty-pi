[package]
name = "pi-core-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "UniFFI boundary: exposes a minimal pi-rpc chat session to Swift for the SW1 spike (macos/swifty-pi). Deliberately smaller than pi-core's full UiSink surface."

[lib]
# staticlib: linked into the SwiftUI app's xcframework. cdylib: what
# `uniffi-bindgen generate --library` reads UniFFI's exported metadata symbols
# from. lib: needed for the `uniffi-bindgen` bin target (below) and for
# `cargo test -p pi-core-ffi` to work normally.
crate-type = ["staticlib", "cdylib", "lib"]

[dependencies]
pi-rpc = { path = "../pi-rpc" }
pi-sessions = { path = "../pi-sessions" }
pi-render = { path = "../pi-render" }
pi-local = { path = "../pi-local" }
base64 = "0.23.0"
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde_json.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Forwards `tracing` events to macOS unified logging (Console.app/`log
# stream`), so a compiled SwiftyPi.app has somewhere for its diagnostics to go
# — otherwise every `tracing::*!` call in this crate and pi-rpc (including
# one that forwards pi's own child-process stderr) is a silent no-op, since
# no subscriber is ever installed without this.
tracing-oslog = "0.3"
trash = "5.2.6"
uniffi = { version = "0.32.0", features = ["cli", "tokio"] }

# Runs `uniffi-bindgen generate --library <cdylib/staticlib> --language swift`
# against this crate without requiring a separately installed `uniffi-bindgen`
# binary — the current UniFFI-recommended pattern (the tool needs to be built
# against the exact proc-macro metadata this crate's `setup_scaffolding!()`
# emits, so a version-pinned in-crate binary avoids drift against whatever
# uniffi-bindgen a developer happens to have installed globally).
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dev-dependencies]
tempfile = "3.27.0"
