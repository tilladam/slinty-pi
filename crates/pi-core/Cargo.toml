[package]
name = "pi-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "UI-toolkit-agnostic core: drives pi-rpc, projects events onto rows, session/model orchestration. Shared by slinty-pi (Slint) and any other frontend."

[dependencies]
pi-rpc = { path = "../pi-rpc" }
pi-sessions = { path = "../pi-sessions" }
pi-render = { path = "../pi-render" }
pi-local = { path = "../pi-local" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
# Same slint-kit rev as pi-render's md-segments; bump them together.
palette-rank = { git = "https://github.com/tilladam/slint-kit", rev = "551aa54e88f77632fa3834243849c5264e639a85" }
base64 = "0.23.0"
directories = "6.0.0"
trash = "5.2.6"

[dev-dependencies]
tempfile = "3.27.0"
