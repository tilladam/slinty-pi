[package]
name = "pi-render"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Stateless message/segment -> row rendering: markdown segmentation, syntax highlighting, and session-history hydration into RowSpecs. Shared by pi-core (live streaming) and pi-core-ffi (Swift history hydration), kept lean (no reqwest/sysinfo/directories) so it's cheap to pull into either."

[dependencies]
pi-rpc = { path = "../pi-rpc" }
serde_json = { workspace = true, features = ["preserve_order"] }
# Markdown segmentation and syntect highlighting, shared with yapper via
# slint-kit (public, crates.io-only dependencies). No tags yet: pinned by rev.
md-segments = { git = "https://github.com/tilladam/slint-kit", rev = "551aa54e88f77632fa3834243849c5264e639a85" }
